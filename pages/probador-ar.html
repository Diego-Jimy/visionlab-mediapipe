<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Probador Virtual | VisionLab</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/probador-ar.css" />
</head>

<body>
  <header class="topbar">
    <a href="../index.html" class="back-btn">
      <i class="bi bi-arrow-left"></i>
      Volver
    </a>

    <h1>Probador Virtual de Accesorios</h1>
    <span class="lib-badge">MediaPipe Face Mesh</span>
  </header>

  <div class="status-bar" id="status-bar">
    <span id="status-text">Iniciando cámara...</span>
  </div>

  <main class="ar-layout">

    <section class="ar-viewer">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>

      <div id="ar-loading" class="ar-loading">
        <div class="spinner"></div>
        <span>Cargando cámara y modelo facial...</span>
      </div>

      <div id="cam-error" class="cam-error hidden">
        <i class="bi bi-camera-video-off"></i>
        <span>Cámara no disponible. Permite el acceso e intenta nuevamente.</span>
      </div>
    </section>

    <aside class="catalog">
      <h2 class="catalog-title">Accesorios</h2>

      <button class="catalog-item active" data-model="0" data-type="glasses" type="button">
        <i class="bi bi-eyeglasses"></i>
        <span>Aviador</span>
      </button>

      <button class="catalog-item" data-model="1" data-type="glasses" type="button">
        <i class="bi bi-sunglasses"></i>
        <span>Retro</span>
      </button>

      <div class="control-group">
        <label for="accessory-type">Tipo de accesorio</label>
        <select id="accessory-type" class="accessory-type">
          <option value="glasses">Gafas</option>
          <option value="hat">Sombrero / Gorra</option>
          <option value="mask">Mascarilla</option>
          <option value="mustache">Bigote</option>
        </select>
      </div>

      <label class="upload-box" id="upload-box">
        <i class="bi bi-upload"></i>
        <span>Subir imagen PNG/JPG</span>
        <small>Recomendado: PNG transparente</small>
        <input id="custom-upload" type="file" accept="image/png,image/jpeg,image/webp" />
      </label>

      <button id="btn-remove-custom" class="secondary-btn" type="button" disabled>
        Quitar imagen subida
      </button>

      <p class="catalog-note">
        El sistema ajusta automáticamente posición, tamaño y rotación según el tipo seleccionado.
      </p>
    </aside>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>
  <script src="../js/probador-ar.js"></script>
</body>
</html>
